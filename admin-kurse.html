<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kursverwaltung — BETAMOVE Admin</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="site-header">
  <div data-r="nav">
    <a href="/" class="brand"><img src="assets-min/logo.png" alt="BETAMOVE"></a>
    <nav data-r="navlinks" id="navLinks">
      <a href="/">Home</a>
      <a href="kurse">Kurse</a>
      <a href="konto">Mein Konto</a>
    </nav>
    <div data-r="navactions">
      <button type="button" class="nav-toggle" id="navToggle" aria-label="Menü öffnen" aria-expanded="false" aria-controls="navLinks">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
    </div>
  </div>
</header>
<main data-r="pad" style="max-width:1160px;margin:0 auto;padding:48px 28px 96px">
  <span class="tag tag-accent" style="font-size:11.5px">Nur für die Kursleitung</span>
  <h1 style="margin:16px 0 8px;font-size:clamp(28px,3.4vw,38px)">Kursverwaltung</h1>
  <p style="margin:0 0 30px;font-size:17px;opacity:0.82">Alle Buchungen im Überblick — Teilnahme hier bestätigen, sobald der Kurs stattgefunden hat.</p>

  <div id="statusBox" style="background:#ffffff;border:1px solid var(--color-divider);border-radius:calc(var(--radius-lg) * 1.15);padding:26px 28px">
    <p style="margin:0;font-size:15.5px;opacity:0.7">Lädt …</p>
  </div>

  <div id="adminArea" hidden>
    <div style="display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin-bottom:22px">
      <label for="courseFilter" style="font-size:14.5px;font-weight:600">Kurs filtern:</label>
      <select id="courseFilter" class="input" style="min-height:42px;font-size:15px;max-width:320px"></select>
      <span id="rowCount" style="font-size:14px;opacity:0.65;margin-left:auto"></span>
    </div>
    <div id="bookingsList" style="display:flex;flex-direction:column;gap:14px"></div>
  </div>
</main>
<footer class="site-footer">
  <div class="footer-grid">
    <div>
      <img src="assets-min/logo.png" alt="BETAMOVE" style="height:74px;width:auto">
      <p style="margin:10px 0 0;font-size:15px;opacity:0.7">Klettertraining mit System – für Einsteiger*innen und Fortgeschrittene.</p>
    </div>
  </div>
  <div class="footer-bottom">© <span id="year">2026</span> BETAMOVE · Alle Rechte vorbehalten</div>
</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/courses-data.js"></script>
<script src="js/main.js"></script>
<script>
(function(){
  // Muss exakt zur ADMIN_EMAIL in js/account.js und den Admin-Policies in
  // supabase/schema-admin-kommentare.sql passen.
  const ADMIN_EMAIL = 'noel.uhlrich@gmail.com';

  function escapeHtml(value) {
    if (value === null || value === undefined) return '';
    return String(value).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
  }

  function courseName(id) {
    const c = (window.BM_COURSES || []).find(c => c.id === id);
    return c ? c.title : id;
  }

  function showStatus(html) {
    const box = document.getElementById('statusBox');
    box.hidden = false;
    box.innerHTML = html;
    document.getElementById('adminArea').hidden = true;
  }

  document.addEventListener('DOMContentLoaded', async () => {
    if (typeof window.bmGetSupabaseClient !== 'function') { showStatus('<p style="margin:0;font-size:15.5px;color:var(--color-accent-700)">Admin-Bereich ist gerade nicht erreichbar.</p>'); return; }
    const { client, error: cfgErr } = window.bmGetSupabaseClient();
    if (!client) { showStatus('<p style="margin:0;font-size:15.5px;color:var(--color-accent-700)">Admin-Bereich ist gerade nicht erreichbar (' + escapeHtml(cfgErr) + ').</p>'); return; }

    let session = null;
    try {
      const { data } = await client.auth.getSession();
      session = data && data.session ? data.session : null;
    } catch (e) { /* session bleibt null */ }

    if (!session) {
      showStatus('<p style="margin:0 0 16px;font-size:15.5px">Bitte melde dich mit deinem Admin-Konto an.</p><a href="login?next=admin-kurse" class="btn btn-primary" style="font-size:15px;padding:12px 22px">Anmelden</a>');
      return;
    }
    if (session.user.email !== ADMIN_EMAIL) {
      showStatus('<p style="margin:0;font-size:15.5px;color:var(--color-accent-700)">Dieser Bereich ist nur für die Kursleitung zugänglich.</p>');
      return;
    }

    document.getElementById('statusBox').hidden = true;
    document.getElementById('adminArea').hidden = false;

    let bookings = [];
    try {
      const { data, error } = await client.from('kursanmeldungen').select('*').order('created_at', { ascending: false });
      if (error) throw error;
      bookings = data || [];
    } catch (e) {
      document.getElementById('bookingsList').innerHTML = '<p style="margin:0;font-size:15.5px;color:var(--color-accent-700)">Buchungen konnten nicht geladen werden. Bitte Seite neu laden.</p>';
      return;
    }

    const filterEl = document.getElementById('courseFilter');
    const courseIds = Array.from(new Set(bookings.map(b => b.kurs_id)));
    filterEl.innerHTML = '<option value="">Alle Kurse</option>' + courseIds.map(id => `<option value="${escapeHtml(id)}">${escapeHtml(courseName(id))}</option>`).join('');

    function renderRow(b) {
      const date = b.created_at ? new Date(b.created_at).toLocaleString('de-DE', { dateStyle: 'medium', timeStyle: 'short' }) : '';
      const confirmedAt = b.teilnahme_bestaetigt_at ? new Date(b.teilnahme_bestaetigt_at).toLocaleDateString('de-DE') : '';
      return `<div data-row data-id="${b.id}" data-kurs="${escapeHtml(b.kurs_id)}" style="background:#ffffff;border:1px solid var(--color-divider);border-radius:calc(var(--radius-lg) * 1.15);padding:20px 24px;display:flex;flex-wrap:wrap;gap:16px;align-items:center">
        <div style="flex:1;min-width:220px">
          <div style="font-size:16.5px;font-weight:600">${escapeHtml(b.vorname)} ${escapeHtml(b.nachname)}</div>
          <div style="font-size:13.5px;opacity:0.7;margin-top:2px">${escapeHtml(b.email)}${b.telefon ? ' · ' + escapeHtml(b.telefon) : ''}</div>
        </div>
        <div style="flex:1;min-width:180px">
          <div style="font-size:15px;font-weight:600">${escapeHtml(courseName(b.kurs_id))}</div>
          <div style="font-size:13px;opacity:0.65;margin-top:2px">Gebucht ${escapeHtml(date)}${b.rabatt_typ === 'student' ? ' · Studierenden-Rabatt' : ''}</div>
          ${b.anmerkungen ? `<div style="font-size:13px;opacity:0.65;margin-top:4px;white-space:pre-wrap">${escapeHtml(b.anmerkungen)}</div>` : ''}
        </div>
        <div style="flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:8px">
          <span data-badge style="font-size:11.5px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;padding:5px 11px;border-radius:999px;background:${b.teilnahme_bestaetigt ? 'var(--color-accent-2-500)' : 'var(--color-neutral-200)'};color:${b.teilnahme_bestaetigt ? '#ffffff' : 'var(--color-neutral-800)'}">${b.teilnahme_bestaetigt ? 'Bestätigt' + (confirmedAt ? ' · ' + confirmedAt : '') : 'Offen'}</span>
          <button type="button" data-confirm-btn class="${b.teilnahme_bestaetigt ? '' : 'btn btn-primary'}" style="cursor:pointer;font:inherit;font-size:13.5px;font-weight:600;padding:9px 18px;border-radius:999px;${b.teilnahme_bestaetigt ? 'border:2px solid var(--color-divider);background:transparent;color:var(--color-text)' : ''}">${b.teilnahme_bestaetigt ? 'Bestätigung zurücknehmen' : 'Teilnahme bestätigen'}</button>
        </div>
      </div>`;
    }

    function renderList() {
      const filter = filterEl.value;
      const visible = filter ? bookings.filter(b => b.kurs_id === filter) : bookings;
      document.getElementById('rowCount').textContent = visible.length + ' von ' + bookings.length + ' Buchungen';
      document.getElementById('bookingsList').innerHTML = visible.length
        ? visible.map(renderRow).join('')
        : '<p style="margin:0;font-size:15.5px;opacity:0.7">Keine Buchungen für diesen Kurs.</p>';
      wireButtons();
    }

    function wireButtons() {
      document.querySelectorAll('[data-row]').forEach(row => {
        const btn = row.querySelector('[data-confirm-btn]');
        if (!btn) return;
        btn.addEventListener('click', async () => {
          const id = row.dataset.id;
          const booking = bookings.find(b => b.id === id);
          if (!booking) return;
          const nowConfirmed = !booking.teilnahme_bestaetigt;
          btn.disabled = true;
          try {
            const { error } = await client.from('kursanmeldungen').update({
              teilnahme_bestaetigt: nowConfirmed,
              teilnahme_bestaetigt_at: nowConfirmed ? new Date().toISOString() : null
            }).eq('id', id);
            if (error) throw error;
            booking.teilnahme_bestaetigt = nowConfirmed;
            booking.teilnahme_bestaetigt_at = nowConfirmed ? new Date().toISOString() : null;
            renderList();
          } catch (e) {
            btn.disabled = false;
            alert('Konnte nicht gespeichert werden. Bitte erneut versuchen.');
          }
        });
      });
    }

    filterEl.addEventListener('change', renderList);
    renderList();
  });
})();
</script>
</body>
</html>
