<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0f6b4f">
<title>Tischtennis-Turnier 🏓</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/fonts.css">
<style>
  :root {
    --bg: #f3f6f4; --card: #ffffff; --ink: #14201b; --muted: #5d6b65; --line: #dde5e1;
    --brand: #0f6b4f; --brand-ink: #ffffff; --accent: #ff7a1a; --soft: #e6f2ed;
    --bad: #c0392b; --win: #0f6b4f; --gold: #f5c542;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1412; --card: #17201c; --ink: #e8efec; --muted: #9aaba4; --line: #2a3832;
      --brand: #2fb487; --brand-ink: #06140f; --accent: #ff9446; --soft: #1d2d27;
      --bad: #ff6b5b; --win: #47d19f;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: 'Poppins', system-ui, -apple-system, sans-serif; font-size: 16px; line-height: 1.45;
    padding-bottom: env(safe-area-inset-bottom);
  }
  header {
    background: var(--brand); color: var(--brand-ink); padding: 18px 16px 0;
    position: sticky; top: 0; z-index: 5; box-shadow: 0 2px 10px rgba(0,0,0,.12);
  }
  .hwrap, main { max-width: 760px; margin: 0 auto; }
  .htop { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  h1 { margin: 0; font-size: 21px; font-weight: 700; letter-spacing: -.01em; }
  #live { font-size: 12px; opacity: .85; white-space: nowrap; }
  #live::before { content: '●'; color: #8affc9; margin-right: 5px; }
  #live.off::before { color: #ffb3a8; }
  .tabs { display: flex; gap: 4px; margin-top: 12px; overflow-x: auto; }
  .tabs button {
    flex: 1; border: 0; background: transparent; color: inherit; opacity: .75; font: inherit; font-weight: 600;
    font-size: 14.5px; padding: 10px 6px 11px; border-bottom: 3px solid transparent; cursor: pointer; white-space: nowrap;
  }
  .tabs button.on { opacity: 1; border-bottom-color: var(--accent); }
  main { padding: 16px; }
  h2 { font-size: 18px; margin: 0 0 10px; }
  h2.sec { margin: 22px 2px 10px; font-size: 16px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  h2.sec:first-of-type { margin-top: 6px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  .card.flush { padding: 0; overflow: hidden; }
  .card.hl { border: 2px solid var(--brand); }
  .muted { color: var(--muted); } .small { font-size: 13.5px; } .center { text-align: center; }
  .empty { padding: 36px 20px; } .big { font-size: 48px; }
  .note { background: var(--soft); border-radius: 10px; padding: 10px 14px; margin-bottom: 14px; font-size: 14px; }
  .note.bad { background: color-mix(in srgb, var(--bad) 14%, var(--card)); color: var(--bad); }

  .match {
    display: block; width: 100%; text-align: left; font: inherit; color: inherit; cursor: pointer;
    background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-bottom: 10px;
    transition: transform .08s;
  }
  .match:active { transform: scale(.99); }
  .match.hot { border: 2px solid var(--accent); box-shadow: 0 4px 16px color-mix(in srgb, var(--accent) 18%, transparent); }
  .match.done { opacity: .85; }
  .mmeta { display: flex; gap: 8px; align-items: center; font-size: 12.5px; color: var(--muted); margin-bottom: 6px; }
  .pill { background: var(--accent); color: #fff; border-radius: 99px; padding: 1px 9px; font-weight: 700; }
  .mrow { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; }
  .mteam { font-weight: 600; overflow-wrap: anywhere; }
  .mteam.right { text-align: right; }
  .mteam.win { color: var(--win); }
  .mteam.win::after { content: ' ✓'; }
  .mscore { font-weight: 800; font-size: 19px; min-width: 56px; text-align: center; font-variant-numeric: tabular-nums; }
  .mhint { font-size: 12px; color: var(--muted); margin-top: 6px; text-align: center; }

  details.plan { margin-top: 22px; }
  details.plan summary { cursor: pointer; font-weight: 600; padding: 10px 2px; color: var(--muted); }
  details.plan h3 { font-size: 14px; margin: 14px 2px 8px; }

  .podium { text-align: center; background: linear-gradient(160deg, var(--soft), var(--card)); }
  .prow { font-size: 18px; font-weight: 700; padding: 6px; }
  .prow.p0 { font-size: 22px; } .medal { margin-right: 8px; }
  ol.final { margin: 0; padding: 14px 14px 14px 40px; } ol.final li { padding: 4px 0; font-weight: 600; }

  .tbl { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 14.5px; }
  .tbl th, .tbl td { padding: 10px 6px; text-align: center; border-bottom: 1px solid var(--line); }
  .tbl th { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; }
  .tbl .l { text-align: left; }
  .tbl tr:last-child td { border-bottom: 0; }
  .tbl tr.top td:first-child { box-shadow: inset 4px 0 0 var(--gold); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .grid .card { margin: 0; }
  .team .tnum { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 6px; }
  .tplayer { display: flex; justify-content: space-between; gap: 8px; font-weight: 600; padding: 3px 0; }
  .chip { width: 100%; border: 1px solid var(--line); background: var(--bg); color: inherit; font: inherit; font-weight: 600;
          border-radius: 9px; padding: 6px 9px; margin-bottom: 6px; cursor: pointer; }
  .chip.sel { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 18%, var(--card)); }
  .skill { background: var(--soft); color: var(--brand); border-radius: 6px; padding: 0 7px; font-size: 13px; font-weight: 700; }

  .row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
  .row > .in { flex: 1; min-width: 140px; }
  .between { display: flex; justify-content: space-between; align-items: baseline; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width: 460px) { .grid2 { grid-template-columns: 1fr; } }
  .fld { display: flex; flex-direction: column; gap: 4px; font-size: 13.5px; color: var(--muted); margin-bottom: 10px; }
  .fld.check { flex-direction: row; align-items: center; gap: 8px; color: var(--ink); font-size: 15px; }
  .fld.check input { width: 20px; height: 20px; }
  .in { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; width: 100%; }
  .btn { font: inherit; font-weight: 600; border: 0; border-radius: 10px; padding: 11px 16px; cursor: pointer;
         background: var(--brand); color: var(--brand-ink); }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.ghost { background: var(--soft); color: var(--brand); }
  .btn.danger { background: transparent; color: var(--bad); border: 1px solid var(--bad); }
  .link { background: none; border: 0; font: inherit; color: var(--brand); cursor: pointer; padding: 4px; text-decoration: underline; }
  .link.bad { color: var(--bad); }

  .plist { display: flex; flex-direction: column; gap: 8px; }
  .prow2 { display: grid; grid-template-columns: 22px minmax(90px, 1fr) minmax(90px, 1.2fr) 26px 30px; gap: 8px; align-items: center; }
  .prow2.off { opacity: .5; }
  .prow2 input[type=checkbox] { width: 20px; height: 20px; }
  .prow2 input[type=range] { width: 100%; accent-color: var(--brand); }
  .prow2 .in { padding: 8px 10px; }
  .sval { font-weight: 800; text-align: center; font-variant-numeric: tabular-nums; }
  .x { border: 0; background: none; color: var(--muted); font-size: 22px; cursor: pointer; line-height: 1; }

  dialog { border: 0; border-radius: 18px; padding: 0; width: min(440px, calc(100vw - 32px)); background: var(--card); color: var(--ink); }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  .dlgin { padding: 20px; }
  .dteams { display: flex; flex-direction: column; align-items: center; gap: 2px; margin: 12px 0 16px; font-size: 18px; text-align: center; }
  .scores { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .sbtn { font: inherit; color: inherit; border: 1px solid var(--line); background: var(--bg); border-radius: 12px; padding: 12px 8px; cursor: pointer;
          display: flex; flex-direction: column; align-items: center; }
  .sbtn.cur { border: 2px solid var(--brand); }
  .sn { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .sw { font-size: 12px; color: var(--muted); text-align: center; overflow-wrap: anywhere; }
  .drow { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; }


  .match { cursor: default; }
  .match.mine { box-shadow: inset 4px 0 0 var(--brand); }
  .match .btn { margin-top: 10px; }
  .pill.soft { background: var(--soft); color: var(--brand); }
  .tl { display: inline-flex; flex-direction: column; }
  .mteam.right .tl { align-items: flex-end; }
  .tl small { font-weight: 400; font-size: 12.5px; color: var(--muted); }
  .btn.small { padding: 8px 12px; font-size: 14.5px; }
  .btn.wide { width: 100%; }
  .btn.big { padding: 15px; font-size: 17px; }
  .row.tight { margin-top: 8px; }
  .card.ok { text-align: center; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .nchip { background: var(--card); border: 1px solid var(--line); border-radius: 99px; padding: 4px 12px; font-weight: 600; font-size: 14.5px; }
  .nchip.me { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
  .fld input[type=range] { width: 100%; accent-color: var(--brand); height: 32px; }
  .myteam { border: 2px solid var(--brand); background: linear-gradient(160deg, var(--soft), var(--card) 70%); }
  .myteam .tnum, .team .tnum { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .tname { font-size: 24px; margin: 4px 0 2px; overflow-wrap: anywhere; }
  .mates { font-weight: 600; }
  .nextup { margin-top: 14px; padding: 12px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; }
  .nextup.now { border: 2px solid var(--accent); }
  .team.mine { border: 2px solid var(--brand); }
  .tname2 { font-weight: 700; color: var(--brand); margin-bottom: 4px; overflow-wrap: anywhere; }
  .tbl tr.mine td { background: var(--soft); }
  .steps { display: grid; grid-template-columns: 1fr auto 1fr; gap: 6px; align-items: end; margin: 14px 0; }
  .colon { font-size: 34px; font-weight: 800; padding-bottom: 14px; }
  .step { display: flex; flex-direction: column; align-items: center; gap: 8px; min-width: 0; }
  .slabel { font-weight: 700; text-align: center; overflow-wrap: anywhere; font-size: 15px; }
  .sctl { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .sb { width: 64px; height: 48px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font-size: 26px; font-weight: 700; cursor: pointer; }
  .sb:active { background: var(--soft); }
  .sv { font-size: 44px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .sinfo { text-align: center; min-height: 22px; margin-bottom: 12px; color: var(--muted); font-size: 14.5px; }
  .sinfo.good { color: var(--win); font-weight: 700; }
  .dlgin .link { display: block; margin: 12px auto 0; }
  .qrbox { display: flex; justify-content: center; margin: 10px 0; }
  .qr { background: #fff; padding: 8px; border-radius: 12px; width: 220px; max-width: 100%; }
  .qr img { display: block; width: 100%; height: auto; image-rendering: pixelated; }
  .qrfull .qr { width: min(340px, 75vw); margin: 0 auto; }

  .toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 30px); opacity: 0; pointer-events: none;
           background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 99px; font-weight: 600; font-size: 14px;
           transition: all .2s; z-index: 20; max-width: calc(100vw - 32px); }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast.bad { background: var(--bad); color: #fff; }
</style>
</head>
<body>
<header>
  <div class="hwrap">
    <div class="htop"><h1 id="title">Tischtennis-Turnier</h1><span id="live" class="off">verbinde …</span></div>
    <nav class="tabs">
      <button data-tab="spiele" class="on">🏓 Spiele</button>
      <button data-tab="tabelle">📊 Tabelle</button>
      <button data-tab="teams">👥 Teams</button>
      <button data-tab="leitung">⚙️ Leitung</button>
    </nav>
  </div>
</header>
<main id="main"></main>
<dialog id="dlg"></dialog>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="js/vendor/supabase-js-2.45.4/supabase.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/supabase-client.js?v=20261020"></script>
<script src="js/vendor/qrcode-generator-1.4.4/qrcode.js"></script>
<script src="js/turnier.js?v=20261112"></script>
</body>
</html>
