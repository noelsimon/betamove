name: Security scan

on:
  push:
  pull_request:
  schedule:
    - cron: '17 6 * * 1' # jeden Montag (UTC) — Grundlage der Wochenprüfung
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (komplette Historie für Secret-Scan)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret-Scan der Git-Historie (gitleaks)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar -xz gitleaks
          ./gitleaks git --redact --no-banner --exit-code 1 .

      - name: Statische Sicherheitsregeln
        run: bash scripts/security-check.sh
