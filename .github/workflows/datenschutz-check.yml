name: Datenschutz-Check

# Automatische Datenschutz-/Sicherheitsprüfung (Konzept: docs/datenschutz/DATENSCHUTZ-KONZEPT.md)
# - bei jedem Push und Pull Request
# - zusätzlich monatlich, damit z. B. eine veraltete Datenschutzerklärung auffällt
on:
  push:
  pull_request:
  schedule:
    - cron: "17 6 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Datenschutz- und Sicherheits-Check
        run: python3 scripts/datenschutz-check.py
